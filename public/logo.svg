<svg xmlns="http://www.w3.org/2000/svg" viewBox="54 54 404 404" width="100%" height="100%">
  <defs>
    <!-- Emerald Core Gradient -->
    <linearGradient id="coreEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="75%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Outer Frame Luminous Metallic Stroke -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="45%" stop-color="#34d399" />
      <stop offset="80%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Radar Sweep Glow Gradient for Transparent Background -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>

    <!-- Enhanced Neon Sci-Fi Glow Filters -->
    <filter id="intenseNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="bracketGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#a7f3d0" flood-opacity="0.9" />
    </filter>

    <filter id="coreGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#10b981" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#6ee7b7" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Radar Bloom with subtle inner containment -->
  <circle cx="256" cy="256" r="156" fill="#10b981" opacity="0.12" filter="blur(24px)" />

  <!-- Calibrated HUD Coordinate Rings & Precision Grids (Optimized contrast for both dark/light background favicon usage) -->
  <g opacity="0.85">
    <!-- Concentric Target Telemetry Rings -->
    <circle cx="256" cy="256" r="186" fill="none" stroke="#059669" stroke-width="1.8" stroke-opacity="0.4" stroke-dasharray="5 7" />
    <circle cx="256" cy="256" r="152" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.6" />
    <circle cx="256" cy="256" r="120" fill="none" stroke="#059669" stroke-width="1.6" stroke-opacity="0.55" stroke-dasharray="6 6" />
    <circle cx="256" cy="256" r="62" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- 45-degree Precision Diagonal Crosshairs -->
    <line x1="138" y1="138" x2="166" y2="166" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <line x1="374" y1="138" x2="346" y2="166" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <line x1="138" y1="374" x2="166" y2="346" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <line x1="374" y1="374" x2="346" y2="346" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

    <!-- Main Cardinal Axis Lines with Sub-ticks -->
    <line x1="256" y1="58" x2="256" y2="104" stroke="#059669" stroke-width="2.2" stroke-dasharray="5 3" />
    <line x1="256" y1="408" x2="256" y2="454" stroke="#059669" stroke-width="2.2" stroke-dasharray="5 3" />
    <line x1="58" y1="256" x2="104" y2="256" stroke="#059669" stroke-width="2.2" stroke-dasharray="5 3" />
    <line x1="408" y1="256" x2="454" y2="256" stroke="#059669" stroke-width="2.2" stroke-dasharray="5 3" />

    <!-- Precision Tick Marks -->
    <circle cx="256" cy="72" r="3" fill="#10b981" />
    <circle cx="256" cy="440" r="3" fill="#10b981" />
    <circle cx="72" cy="256" r="3" fill="#10b981" />
    <circle cx="440" cy="256" r="3" fill="#10b981" />
  </g>

  <!-- Luminous Radar Sweep Pulse (Scraper Listening Field) -->
  <path d="M 256 256 L 396 166 A 152 152 0 0 0 256 104 Z" fill="url(#radarSweep)" opacity="0.8" />

  <!-- Four Precision Cyber HUD Brackets with Laser Neon Glow (8px crisp line weight) -->
  <g filter="url(#bracketGlow)">
    <!-- Top-Left Bracket -->
    <path d="M 124 192 L 124 142 L 142 124 L 192 124" fill="none" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="124" cy="192" r="4.5" fill="#ffffff" />
    <circle cx="192" cy="124" r="4.5" fill="#ffffff" />
    <!-- Tech Accent Cutout Notch -->
    <line x1="144" y1="144" x2="158" y2="144" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="144" y1="144" x2="144" y2="158" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

    <!-- Top-Right Bracket -->
    <path d="M 388 192 L 388 142 L 370 124 L 320 124" fill="none" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="388" cy="192" r="4.5" fill="#ffffff" />
    <circle cx="320" cy="124" r="4.5" fill="#ffffff" />
    <!-- Tech Accent Cutout Notch -->
    <line x1="368" y1="144" x2="354" y2="144" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="368" y1="144" x2="368" y2="158" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

    <!-- Bottom-Left Bracket -->
    <path d="M 124 320 L 124 370 L 142 388 L 192 388" fill="none" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="124" cy="320" r="4.5" fill="#ffffff" />
    <circle cx="192" cy="388" r="4.5" fill="#ffffff" />
    <!-- Tech Accent Cutout Notch -->
    <line x1="144" y1="368" x2="158" y2="368" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="144" y1="368" x2="144" y2="354" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

    <!-- Bottom-Right Bracket -->
    <path d="M 388 320 L 388 370 L 370 388 L 320 388" fill="none" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="388" cy="320" r="4.5" fill="#ffffff" />
    <circle cx="320" cy="388" r="4.5" fill="#ffffff" />
    <!-- Tech Accent Cutout Notch -->
    <line x1="368" y1="368" x2="354" y2="368" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="368" y1="368" x2="368" y2="354" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Segmented Target Lock Aperture Ring -->
  <g stroke="#10b981" stroke-width="3.5" stroke-linecap="round" opacity="0.95" filter="url(#intenseNeonGlow)">
    <path d="M 216 172 A 92 92 0 0 1 296 172" fill="none" />
    <path d="M 340 216 A 92 92 0 0 1 340 296" fill="none" />
    <path d="M 296 340 A 92 92 0 0 1 216 340" fill="none" />
    <path d="M 172 296 A 92 92 0 0 1 172 216" fill="none" />
  </g>

  <!-- Optical Calibration Reticle Ticks -->
  <g fill="#34d399">
    <rect x="254" y="156" width="4" height="15" rx="2" />
    <rect x="254" y="341" width="4" height="15" rx="2" />
    <rect x="156" y="254" width="15" height="4" rx="2" />
    <rect x="341" y="254" width="15" height="4" rx="2" />
  </g>

  <!-- Enhanced Glowing Core & Media Playhead Extraction Node -->
  <g filter="url(#coreGlow)">
    <!-- High-Tech Core Outer Chassis -->
    <circle cx="256" cy="256" r="66" fill="#022c22" stroke="#10b981" stroke-width="3.5" />
    <!-- Intense Emerald Glowing Core with Neon Gradient -->
    <circle cx="256" cy="256" r="54" fill="url(#coreEmerald)" />

    <!-- Pure Laser White Extraction Playhead -->
    <path d="M 240 218 C 240 210 249 205 256 210 L 298 248 C 304 252 304 260 298 264 L 256 302 C 249 307 240 302 240 294 Z" fill="#ffffff" />
    
    <!-- Central Optical Telemetry Eye Dot -->
    <circle cx="259" cy="256" r="4.5" fill="#047857" />
  </g>

  <!-- Laser Lock Coordinate Indicator Pulses -->
  <circle cx="256" cy="124" r="6" fill="#a7f3d0" filter="url(#bracketGlow)" />
  <circle cx="388" cy="256" r="6" fill="#a7f3d0" filter="url(#bracketGlow)" />
  <circle cx="256" cy="388" r="6" fill="#a7f3d0" filter="url(#bracketGlow)" />
  <circle cx="124" cy="256" r="6" fill="#a7f3d0" filter="url(#bracketGlow)" />

  <!-- Data Telemetry Beacon Star (Top-Right Precision HUD Mark) -->
  <path d="M 412 88 Q 412 102 426 102 Q 412 102 412 116 Q 412 102 398 102 Q 412 102 412 88 Z" fill="#34d399" opacity="0.95" filter="url(#bracketGlow)" />
</svg>